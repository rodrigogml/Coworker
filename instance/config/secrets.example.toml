[executables]
gui = "C:/caminho/para/KeePassXC.exe"
cli = "C:/caminho/para/keepassxc-cli.exe"

[vault]
path = "data/secrets/vault.kdbx"

[windows_credential]
target = "Coworker/Instances/INSTANCE_ID/KeePassXC/MasterPassword"

[linux_credential]
# Ciphertext criado por `systemd-creds encrypt`; nunca coloque a senha mestra aqui.
encrypted_path = "data/secrets/master-password.cred"
name = "coworker-master-password"
