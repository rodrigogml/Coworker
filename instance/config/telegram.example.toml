# Copie para data/config/telegram.toml e ajuste somente valores locais.
transport = "polling"
credential_ref = "APIs/Telegram/INSTANCE_ID"
project_root = "."
state_dir = "data/telegram/state"
poll_timeout_seconds = 45
request_timeout_seconds = 60

[logging]
enabled = true
level = "INFO"
directory = "data/log"
retention_days = 15

# Retenções mínimas de contexto e artefatos. O configurador aceita valores maiores,
# mas não permite menos de 180 dias.
[retention]
raw_messages_days = 180
attachments_days = 180
artifacts_days = 180
summaries_days = 180

# Grupos são vinculados por handshake do configurador. Não informe credenciais aqui.
# [groups.financeiro]
# chat_id = -1001234567890
# enabled = true
# forum_required = true
# default_topic_policy = "run"
# capture_mode = "mentions_and_replies"
# retention_days = 180
# privacy_disabled_confirmed = false

[pairing]
ttl_seconds = 600
max_attempts = 5

[codex]
executable = ""
home_dir = "data/codex"
backend = "exec"
generated_images_dir = "data/codex/generated_images"
access_mode = "restricted"
sandbox = "workspace-write"
network_access = false
approval_policy = "never"
# Deixe vazio para herdar o padrão da conta/Codex. Estas opções também podem
# ser personalizadas pela pessoa proprietária com /settings no Telegram.
model = ""
reasoning_effort = ""
speed = "standard"
verbosity = ""
timeout_seconds = 1800
additional_directories = []
writable_directories = ["data/work"]

[media]
inbox_dir = "data/telegram/inbox"
jobs_dir = "data/telegram/jobs"
max_download_bytes = 20971520
max_upload_bytes = 20971520

[processors]
max_extracted_characters = 200000
max_archive_members = 500
max_uncompressed_bytes = 104857600
max_pages = 200
max_duration_seconds = 3600
max_frames = 100

[processors.transcription]
enabled = false
backend = "cli"
auto_start = false
python_executable = ""
project_dir = ""
endpoint = "http://127.0.0.1:8870"
allow_remote = false
timeout_seconds = 120
language = "pt-BR"
profile = ""
model = "medium"
device = "cpu"
compute_type = "int8"
prompt = ""
terms = []
aliases = []
minimum_confidence = 0.55

[processors.speech]
enabled = false
backend = "cli"
python_executable = ""
project_dir = ""
endpoint = "http://127.0.0.1:8870"
allow_remote = false
timeout_seconds = 120
voices = []
languages = ["pt-BR"]
default_voice = ""
default_language = "pt-BR"
default_speed = 1.0
max_characters = 4000
format = "opus"

# O andamento é indicado por reações na mensagem original: processamento, 🆒 na fila
# e 💯 ao concluir. As listas de mensagens antigas continuam aceitas para compatibilidade.
# Para personalizá-las, defina aqui `immediate_messages = [...]` e/ou
# `queued_messages = [...]`.
[feedback]
typing_interval_seconds = 4

[webhook]
public_url = ""
secret_credential_ref = "APIs/Telegram/INSTANCE_ID-webhook"
listen_host = "127.0.0.1"
listen_port = 8787

# Mini App TOTP servido pelo próprio Gateway. Telegram exige URL HTTPS pública
# para abrir em produção; listen_host/port são o listener local do Gateway.
[mini_app]
enabled = false
listen_host = "127.0.0.1"
listen_port = 8790
public_url = ""
session_ttl_seconds = 900
